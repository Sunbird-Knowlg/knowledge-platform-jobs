include "base-test.conf"

job {
  env = "test"
}

kafka {
  input.topic = "local.content.embedding.input"
  output.topic = "local.content.embedding.output"
  error.topic = "local.content.embedding.error"
  groupId = "content-embedding-test-group"
}

task {
  consumer.parallelism = 1
  extract.parallelism = 1
  chunking.parallelism = 1
  embedding.parallelism = 1
  quantization.parallelism = 1
  sink.parallelism = 1
}

chunking {
  strategy = "semantic"

  semantic {
    max_chunk_size = 1000
  }

  sliding-window {
    max_words     = 512
    overlap_words = 102
  }
}

embedding {
  service = "e5"
  batch_size = 4

  e5 {
    host = "localhost"
    port = 8000
    dimensions = 768
    timeout = 5
  }

  openai {
    api_key = "test-key"
    model = "text-embedding-3-small"
    dimensions = 1536
    timeout = 5
  }
}

quantization {
  strategy = "int8"
}

opensearch {
  host = "localhost"
  port = 9200
  index.name = "compositesearch"
  user = ""
  password = ""
}
