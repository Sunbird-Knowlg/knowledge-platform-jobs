include "base-config.conf"

job {
  env = "dev"
}

kafka {
  input.topic = "sunbirddev.enriched.content.metadata"
  output.topic = "sunbirddev.embedding.chunks"
  error.topic = "sunbirddev.embedding.error"
  groupId = "content-embedding-group"
}

# Supported _schema_version values for incoming enriched events.
# Events with a version outside this list are routed to the DLQ instead of
# being silently processed against a stale schema.
schema {
  supported_versions = ["1.0"]
}

task {
  consumer.parallelism = 1
  extract.parallelism = 2
  chunking.parallelism = 2
  embedding.parallelism = 2
  quantization.parallelism = 2
  sink.parallelism = 1
}

chunking {
  # "semantic"       — field-based, 1 chunk per content section (short metadata)
  # "sliding-window" — 512-word windows with overlap (long text, full documents)
  strategy = "semantic"

  semantic {
    max_chunk_size = 1000   # characters; text truncated at this length
    excluded_fields = [
      "hierarchy",
      "children",
      "id",
      "identifier",
      "contentType",
      "_schema_version",
      "timestamp"
    ]                       # fields to exclude from dynamic metadata extraction
  }

  sliding-window {
    max_words     = 512     # words per window
    overlap_words = 102     # words shared between consecutive windows (20% of 512)
  }
}

embedding {
  service = "openai"
  batch_size = 32

  e5 {
    host = "e5-embedding.semantic.svc.cluster.local"
    host = ${?E5_EMBEDDING_HOST}
    port = 80
    port = ${?E5_EMBEDDING_PORT}
    dimensions = 768
    timeout = 30
  }

  openai {
    api_key = ""
    api_key = ${?OPENAI_API_KEY}
    model = "text-embedding-3-small"
    dimensions = 1536
    timeout = 30

    # Azure OpenAI — set these to use Azure instead of api.openai.com
    azure_endpoint = ""
    azure_endpoint = ${?AZURE_OPENAI_ENDPOINT}
    azure_deployment = "text-embedding-3-small"
    azure_deployment = ${?AZURE_OPENAI_DEPLOYMENT}
    azure_api_version = "2024-12-01-preview"
  }
}

quantization {
  strategy = "int8"
}

opensearch {
  host = "localhost"
  port = 9200
  index.name = "compositesearch"
  user = ""
  password = ""
}
